events {}
http {
    access_log off;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_req_zone $binary_remote_addr zone=calendar:10m rate=3r/s;
    server {
        listen 80;
        server_name pplan.ufian.com;
        location /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { return 301 https://pplan.ufian.com:8443$request_uri; }
    }
    server {
        listen 8443 ssl;
        server_name pplan.ufian.com;
        ssl_certificate /etc/letsencrypt/live/pplan.ufian.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pplan.ufian.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            limit_req zone=calendar burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:18080;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 20s;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
