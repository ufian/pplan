<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3f1"><title>Parenting Plan · Calendar</title><script src="https://telegram.org/js/telegram-web-app.js?65"></script><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><nav class="navigation" aria-label="Calendar navigation"><button id="menu-button" class="icon hamburger" aria-label="Open calendar menu" aria-controls="menu">☰</button><button id="previous" class="icon" aria-label="Previous month">‹</button><label class="month-picker"><span id="month-title">Calendar</span><input type="month" id="month" min="1901-01" max="2099-12" aria-label="Choose month"></label><button id="next" class="icon" aria-label="Next month">›</button></nav><div id="status" role="status" aria-live="polite">Loading your calendar…</div><div id="app" hidden><div id="months"></div><div id="load-more" role="status">Scroll down for the next month</div><button id="retry" class="text-button" hidden>Try again</button></div>
<dialog id="menu" class="menu-dialog" aria-labelledby="menu-title"><div class="dialog-heading"><h2 id="menu-title">Calendar options</h2><button id="close-menu" class="icon" aria-label="Close menu">×</button></div><p class="label">Show children</p><div id="filters" class="filters"></div><div class="menu-actions"><button id="specials-button" class="menu-action">Special events</button><button id="today" class="menu-action">Go to today</button><button id="refresh" class="menu-action">Refresh calendar</button></div><p id="timezone" class="muted"></p></dialog>
<dialog id="day-dialog" class="day-dialog" aria-label="Day details"><div class="dialog-heading"><span class="label">DAY DETAILS</span><button id="close-day" class="icon" aria-label="Close day details">×</button></div><section id="detail" aria-live="polite"></section><section class="totals-card"><div class="section-heading"><h2>Nights together</h2><select id="totals-period" aria-label="Night count period"><option value="month">This month</option><option value="year">Year to month end</option></select></div><p id="totals-range" class="muted"></p><div id="totals"></div></section></dialog><dialog id="specials-dialog" class="menu-dialog" aria-labelledby="specials-title"><div class="dialog-heading"><h2 id="specials-title">Special events</h2><button id="close-specials" class="icon" aria-label="Close special events">×</button></div><p id="specials-status" role="status"></p><div id="specials-list"></div></dialog>
<dialog id="event-editor" class="event-editor" aria-labelledby="editor-title"><div class="dialog-heading"><h2 id="editor-title">Edit special event</h2><button id="close-editor" class="icon" aria-label="Close event editor">×</button></div><form id="event-form"><fieldset id="event-fields"><label class="field">Title<input id="event-title" maxlength="120" autocomplete="off"></label><div class="date-fields"><label class="field">Start date<input type="date" id="event-start" required min="1901-01-01" max="2099-12-31"></label><label class="field">End date<input type="date" id="event-end" required min="1901-01-01" max="2099-12-31"></label></div><p class="muted">Both dates are included.</p><label class="field">Description<textarea id="event-description" maxlength="2000" rows="3"></textarea></label><label class="field">Color<select id="event-color" aria-label="Event color"></select></label><div id="event-palette" class="color-palette" aria-label="Google Calendar event colors"></div><div id="event-preview" class="event-preview">Special event</div></fieldset><p id="event-error" class="form-error" role="alert"></p><div class="form-actions"><button type="button" id="cancel-editor" class="secondary-button">Cancel</button><button type="submit" id="save-event" class="primary-button">Save changes</button></div></form></dialog></main></body></html>
