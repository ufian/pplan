<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e2a"><title>Parenting Plan · Calendar</title><script src="https://telegram.org/js/telegram-web-app.js?65"></script><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div class="eyebrow">PARENTING PLAN</div><div class="title-row"><h1>Family calendar</h1><button id="refresh" class="icon" aria-label="Refresh calendar">↻</button></div><p id="timezone">Your time, together.</p></header>
<div id="status" role="status" aria-live="polite">Loading your calendar…</div>
<div id="app" hidden><section class="calendar-card" aria-label="Monthly calendar"><div class="month-nav"><button id="previous" class="icon" aria-label="Previous month">‹</button><label class="month-picker"><span id="month-title"></span><input type="month" id="month" min="1901-01" max="2099-12" aria-label="Choose month"></label><button id="next" class="icon" aria-label="Next month">›</button></div><div class="toolbar"><div id="legend" class="legend"></div><button id="today" class="text-button">Today</button></div><div id="filters" class="filters" aria-label="Show children"></div><div class="weekdays" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div id="grid" class="grid"></div><p class="hint">Split colors show a handover. Tap a day for details.</p></section>
<section id="detail" class="detail-card" aria-live="polite"></section><section class="totals-card"><div class="section-heading"><h2>Nights together</h2><select id="totals-period" aria-label="Night count period"><option value="month">This month</option><option value="year">Year to month end</option></select></div><p id="totals-range" class="muted"></p><div id="totals"></div></section><footer>Live from your parenting plan · View only</footer></div></main></body></html>
