x-runtime: &runtime
  image: pplan:local
  user: "1000:1000"
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:mode=1777,size=128m"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  bot:
    <<: *runtime
    depends_on:
      ai: {condition: service_healthy}
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      GOOGLE_TOKEN_PATH: /data/google-token.json
      PPLAN_AI_URL: http://ai:8080
      PPLAN_AI_ENABLED: ${PPLAN_AI_ENABLED:-false}
    secrets: [telegram_bot_token]
    volumes:
      - ./config.json:/config/config.json:ro
      - ./data/bot:/data
    healthcheck:
      test: [CMD, python, -m, pplan.cli, --config, /config/config.json, --database, /data/plan.sqlite3, health]
      interval: 60s
      timeout: 10s
      start_period: 180s
      retries: 3
    stop_grace_period: 60s
  ai:
    <<: *runtime
    build: .
    command: [python, -m, pplan.ai_server]
    environment:
      CODEX_HOME: /home/app/.codex
      CODEX_MODEL: gpt-6-luna
    volumes:
      - ./data/codex:/home/app/.codex
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
