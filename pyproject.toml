[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pplan"
version = "0.1.0"
description = "A Telegram-first, solo-managed parenting schedule"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<14"]

[project.optional-dependencies]
google = ["google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3"]

[project.scripts]
pplan = "pplan.cli:main"

[tool.setuptools.packages.find]
include = ["pplan*"]

[tool.setuptools.package-data]
pplan = ["web/*.html", "web/*.css", "web/*.js"]
