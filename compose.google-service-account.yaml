# Add to COMPOSE_FILE only after provisioning the private key and Calendar ID.
services:
  bot:
    environment:
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google_service_account
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:?Set GOOGLE_CALENDAR_ID in the private .env}
    secrets: [google_service_account]

secrets:
  google_service_account:
    file: ./secrets/google_service_account.json
